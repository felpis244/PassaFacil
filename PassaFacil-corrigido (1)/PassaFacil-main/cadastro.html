<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro | PassaFácil</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style-login.css">
  <link rel="stylesheet" href="css/toast.css">
</head>
<body>
    <header class="header-login">
      <a href="index.html" class="logo-link">
        <img src="assets/img/passafacil-removebg-preview.png" alt="PassaFácil" class="logo-img">
      </a>


    </header>  

  <div class="login-container">
    <div class="login-box">
      <img src="assets/img/passafacil-removebg-preview.png" alt="Logo" class="logo-form">
      <h2 id="titulo">Seja Bem Vindo !</h2>
      <p id="descricao">Crie a conta e comece a evoluir</p>

      <form id="form-cadastro"> 
            <div class="input-group">
                <label id="labelNome" for="nome">Nome Completo</label>
                <input type="text" id="nome" placeholder="Nome completo" required>
            </div>

            <div class="input-group">
                <label id="labelEmail" for="email">E-mail</label>
                <input type="email" id="email" placeholder="xxx@email.com" required>
            </div>

            <div class="input-group">
                <label id="labelSenha" for="senha">Crie uma senha</label>
                <input type="password" id="senha" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn-login" id="btnCadastrar">Cadastrar</button>
        </form>

        <div class="separador">
          <span>ou</span>
        </div>

        <button id="btn-google" class="btn-google">
          <img src="https://www.google.com/favicon.ico" width="18"> Cadastrar com Google
        </button>

      <p class="footer-text" id="jatem">Ja tem uma conta? <a href="login.html">Entre</a></p>
    </div>
  </div>
  
  <script src="js/toast.js"></script>
  <script type="module" src="js/script-cadastro.js"></script>

</body>
</html>
