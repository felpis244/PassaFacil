<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PassaFácil — Perfil</title>
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/perfil.css">
    <link rel="stylesheet" href="css/toast.css">
    <link rel="stylesheet" href="css/loader.css">
    <link rel="stylesheet" href="css/confirmar.css">
</head>

<body>

  <header>
        <nav>
            <a href="dashboard.html" class="logo-link">
                <img src="assets/img/passafacil-removebg-preview.png" alt="PassaFácil" class="logo-img">
            </a>
        </nav>
  </header>
    <!-- menu lateral -->
    <main class="dashboard-main">

        <aside class="mlateral">
            <div class="avatar grande" id="avatar-sidebar"></div>
            

            <nav class="mlateral-nav">
                <a href="dashboard.html" class="mlateral-link">🏠 <span>Início</span></a>
                <a href="perfil.html" class="mlateral-link ativo">👤 <span>Perfil</span></a>
                <a href="ranking.html" class="mlateral-link">🏆 <span>Ranking</span></a>
                <a href="index.html" class="mlateral-link" id="logout-btn">
                    🚪 <span>Sair</span>
                </a>
            </nav>
        </aside>

        <!-- perfil -->
        <div class="dashboard-conteudo">

            <div class="perfil-topo">
                <div class="perfil-avatar-grande" id="avatar-grande"></div>
                <div>
                    <h1 id="perfil-nome"></h1>
                    <p id="perfil-email"></p>
                    <p id="perfil-bio" class="perfil-bio"></p>
                </div>
            </div>
        
      

            <div class="perfil-stats">
                <div class="resumo-card amarelo">
                    <p>XP Total</p>
                    <h2 id="perfil-xp"></h2>
                </div>
                <div class="resumo-card vermelho">
                    <p>Vidas</p>
                    <h2 id="perfil-vidas"></h2>
                </div>
                <div class="resumo-card verde">
                    <p>Sequência</p>
                    <h2 id="perfil-sequencia"></h2>
                </div>
            </div>

            <!-- editar perfil -->
            
            <div class="perfil-editar">
                <h2 class="perfil-editar-titulo">Editar perfil</h2>

                <div class="form-group">
                    <label>Nome</label>
                    <input type="text" id="edit-nome" placeholder="Seu nome completo">
                </div>

                <div class="form-group">
                    <label>Bio</label>
                    <textarea id="edit-bio" placeholder="Fale um pouco sobre você..."></textarea>
                </div>

                <div class="form-group">
                    <label>Cor do avatar</label>
                    <div class="cores-avatar">
                        <div class="cor-opcao" style="background:#4c2a96;" data-cor="#4c2a96"></div>
                        <div class="cor-opcao" style="background:#1D9E75;" data-cor="#1D9E75"></div>
                        <div class="cor-opcao" style="background:#ff4d6a;" data-cor="#ff4d6a"></div>
                        <div class="cor-opcao" style="background:#FFD700;" data-cor="#FFD700"></div>
                        <div class="cor-opcao" style="background:#3b82f6;" data-cor="#3b82f6"></div>
                        <div class="cor-opcao" style="background:#f97316;" data-cor="#f97316"></div>
                    </div>
                </div>

                <button id="btn-salvar-perfil" class="btn-comecar">Salvar alterações</button>
                </div>

            <!-- mudar senha -->
            <div class="perfil-editar">
                <h2 class="perfil-editar-titulo">Alterar senha</h2>

                <div class="form-group">
                    <label>Senha atual</label>
                    <input type="password" id="senha-atual" placeholder="••••••••">
                </div>

                <div class="form-group">
                    <label>Nova senha</label>
                    <input type="password" id="nova-senha" placeholder="••••••••">
                    <small class="senha-dica">Mínimo 8 caracteres, com maiúscula, minúscula, número e caractere especial (ex: !@#$)</small>
                </div>

                <div class="form-group">
                    <label>Confirmar nova senha</label>
                    <input type="password" id="confirmar-senha" placeholder="••••••••">
                </div>

                <button id="btn-alterar-senha" class="btn-comecar">Alterar senha</button>
            </div>

        </div>

    </main>

    <script src="js/toast.js"></script>
    <script src="js/loader.js"></script>
    <script src="js/confirmar.js"></script>
    <script type="module" src="js/script-perfil.js"></script>

</body>
</html>
